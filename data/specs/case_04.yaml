openapi: "3.0.0"
info:
  title: Inventory Service
  version: "1.0"
paths:
  /items:
    get:
      summary: List inventory items
      responses:
        "200":
          description: List of items
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    stock:
                      type: integer
