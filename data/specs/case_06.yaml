openapi: "3.0.0"
info:
  title: User Update Service
  version: "1.0"
paths:
  /users/{user_id}:
    put:
      summary: Update user profile fields
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                bio:
                  type: string
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  display_name:
                    type: string
                  bio:
                    type: string
