openapi: "3.0.0"
info:
  title: Auth Service
  version: "1.0"
paths:
  /auth/login:
    post:
      summary: Authenticate user and return token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Successful authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  expires_in:
                    type: integer
