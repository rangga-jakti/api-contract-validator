openapi: "3.0.0"
info:
  title: Webhook Service
  version: "1.0"
paths:
  /webhooks:
    post:
      summary: Receive incoming webhook
      parameters:
        - name: X-Webhook-Secret
          in: header
          required: true
          schema:
            type: string
          description: Secret token to validate webhook authenticity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event
                - payload
              properties:
                event:
                  type: string
                payload:
                  type: object
      responses:
        "200":
          description: Webhook received and acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
        "401":
          description: Invalid or missing secret
