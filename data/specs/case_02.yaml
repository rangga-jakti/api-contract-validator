openapi: "3.0.0"
info:
  title: Product Service
  version: "1.0"
paths:
  /products:
    get:
      summary: List all products
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    price:
                      type: number
                    category:
                      type: string
